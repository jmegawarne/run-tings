<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen recipes</title>
<style>
  :root { --bar: #1e1e1e; --ink: #fafafa; --dim: #a8a8a8; --accent: #f06a4e; --bg: #111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Roboto, Arial, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #deck { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
  /* The slides and the steam share one 16:9 box, the largest the stage holds (sized in the script),
     so the steam can be placed in percentages of the slide. */
  #frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  #ghost, #steam { pointer-events: none; }
  /* Steam on a title slide, in the empty band between its meta line (which ends at 62%) and its
     foot line (from 88%): three soft streaks that rise, lean, widen and fade, never above 0.2. */
  #steam { position: absolute; left: 0; top: 63%; width: 100%; height: 21%; overflow: hidden; }
  #steam span { position: absolute; bottom: 0; width: 2.4%; height: 55%; opacity: 0; transform-origin: 50% 100%;
    background: radial-gradient(closest-side, #fff, rgba(255, 255, 255, .5) 55%, rgba(255, 255, 255, 0));
    animation: steam 7s ease-in-out infinite backwards; }
  #steam span:nth-child(1) { left: 37.8%; animation-delay: 2.3s; }
  #steam span:nth-child(2) { left: 48.8%; animation-duration: 6.5s; }
  #steam span:nth-child(3) { left: 59.8%; animation-delay: 4.6s; animation-duration: 7.5s; }
  @keyframes steam {
    0% { opacity: 0; transform: translate(0, 0) scale(.8, .7) skewX(0deg); }
    40% { opacity: .2; }
    100% { opacity: 0; transform: translate(40%, -65%) scale(1.6, 1.1) skewX(-14deg); }
  }
  #bar { height: 80px; display: flex; align-items: stretch; background: var(--bar); }
  #bar button, #stations button { border: 0; background: none; color: var(--ink); font: inherit; font-size: 24px;
    padding: 0 26px; }
  #bar button:disabled { color: #555; }
  #bar #next { margin-left: auto; color: var(--accent); font-weight: 700; }
  #where { align-self: center; color: var(--dim); font-size: 20px; padding: 0 12px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #radio { flex: none; }
  #radio[data-state="connecting"], #radio[data-state="unavailable"] { color: var(--dim); }
  #radio[data-state="on"], #stations .on { color: var(--accent); }
  #picker { position: fixed; inset: 0; }
  #stations { position: absolute; bottom: 88px; display: flex; flex-direction: column; padding: 6px 0;
    border-radius: 10px; background: #2c2c2c; box-shadow: 0 6px 30px #000; }
  #stations button { height: 72px; text-align: left; }
  #stations button::before { content: '✓'; display: inline-block; width: 36px; visibility: hidden; }
  #stations .on::before { visibility: visible; }
  #stations #stop { border-top: 1px solid #444; }
  #days { position: fixed; inset: 0; overflow-y: auto; padding: 28px 40px 40px; background: var(--bar); }
  #days h1 { font-size: 30px; margin: 0 0 18px; }
  #days .day { margin: 18px 0 6px; color: var(--dim); font-size: 20px; }
  #days .day.today { color: var(--accent); font-weight: 700; }
  #days button { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; margin: 6px 0;
    padding: 18px 22px; background: #2c2c2c; color: var(--ink); font: inherit; font-size: 24px; }
  #days .note { color: var(--dim); font-size: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="deck" hidden>
  <div id="stage"><div id="frame"><img id="ghost" alt="" hidden><img id="slide" alt="">
    <div id="steam"><span></span><span></span><span></span></div></div></div>
  <div id="bar">
    <button id="back" aria-label="Previous slide">&lsaquo; Back</button>
    <button id="list" aria-label="Choose a day">Days</button>
    <button id="radio" data-state="off">♪ Radio</button>
    <span id="where"></span>
    <button id="next" aria-label="Next slide">Next &rsaquo;</button>
  </div>
  <div id="picker" hidden>
    <div id="stations">
      <!-- Each station's streams, tried in turn until one plays: AAC first, as that's what plays on the Hub. -->
      <button data-streams="https://media-ssl.musicradio.com/SmoothChill https://media-ssl.musicradio.com/SmoothChillMP3">Smooth Chill</button>
      <button data-streams="https://media-ssl.musicradio.com/RadioX00s https://media-ssl.musicradio.com/RadioX00sMP3">Radio X 00s</button>
      <button data-streams="https://media-ssl.musicradio.com/CapitalXTRAReloaded https://media-ssl.musicradio.com/CapitalXTRAReloadedMP3">Capital XTRA Reloaded</button>
      <button id="stop" hidden>Stop radio</button>
    </div>
  </div>
</div>
<div id="days" hidden></div>
<audio id="stream" preload="none"></audio>
<script>
'use strict';
// The kitchen screen for our Hub decks: each deck's slides as images, tapped through on the
// Nest Hub's own screen once the page has been cast to it, so no phone has to stay connected.
// Reads ../recipes.json for what's on which day and decks.json for each deck's slide count.
// Query options: ?date=YYYY-MM-DD shows that day; ?deck=<deck id> opens one deck.

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const params = new URLSearchParams(location.search);
const today = params.get('date') || iso(new Date());
let recipes = {}, decks = {}, current = null;   // current = {list, index, slide}

function label(date) {
  const [y, m, d] = date.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
function src(deck, n) { return 'slides/' + deck + '/' + pad(n) + '.webp'; }

function save() {
  try {
    if (current) localStorage.setItem('hub', JSON.stringify({ date: today, deck: current.list[current.index].deck,
      slide: current.slide, at: Date.now() }));
  } catch (e) { /* storage is a nicety; the page works without it */ }
}
function saved() {
  try {
    const s = JSON.parse(localStorage.getItem('hub') || 'null');
    return s && s.date === today && Date.now() - s.at < 4 * 3600e3 ? s : null;
  } catch (e) { return null; }
}

function openDeck(list, index, slide, dir) {   // dir: 1 or -1 when Next or Back moves on to another dish
  const r = list[index], info = decks[r.deck];
  if (!info) {
    showDays(r.dish + ' isn’t on the kitchen screen yet.');
    return;
  }
  current = { list, index, slide: Math.min(Math.max(slide || 1, 1), info.slides) };
  $('days').hidden = true;
  $('deck').hidden = false;
  draw(dir || 0);
}

function draw(dir) {
  const r = current.list[current.index], n = decks[r.deck].slides, s = current.slide;
  show(src(r.deck, s), dir, s === 1);
  $('slide').alt = r.dish + ', slide ' + s + ' of ' + n;
  $('where').textContent = s + ' / ' + n + '  ·  ' + r.dish;
  $('back').disabled = s === 1 && current.index === 0;
  const more = current.index < current.list.length - 1;
  $('next').disabled = s === n && !more;
  $('next').innerHTML = s === n && more ? 'Next dish &rsaquo;' : 'Next &rsaquo;';
  for (const k of [s - 1, s + 1]) {   // fetch the neighbours now, so a tap shows them at once
    if (k >= 1 && k <= n) new Image().src = src(r.deck, k);
  }
  save();
}

function step(by) {
  if (!current) return;
  const n = decks[current.list[current.index].deck].slides;
  const s = current.slide + by;
  if (s >= 1 && s <= n) { current.slide = s; draw(by); }
  else if (s > n && current.index < current.list.length - 1) openDeck(current.list, current.index + 1, 1, 1);
  else if (s < 1 && current.index > 0) {
    const prev = current.list[current.index - 1];
    openDeck(current.list, current.index - 1, decks[prev.deck] ? decks[prev.deck].slides : 1, -1);
  }
}

function showDays(note) {
  $('deck').hidden = true;
  showSteam();
  const box = $('days');
  box.innerHTML = '<h1>What are we cooking?</h1>' + (note ? '<p class="note"></p>' : '');
  if (note) box.querySelector('.note').textContent = note;
  for (const date of Object.keys(recipes).sort()) {
    const head = document.createElement('div');
    head.className = 'day' + (date === today ? ' today' : '');
    head.textContent = (date === today ? 'Today, ' : '') + label(date);
    box.appendChild(head);
    recipes[date].forEach((r, i) => {
      const b = document.createElement('button');
      b.textContent = r.dish;
      b.onclick = () => openDeck(recipes[date], i, 1);
      box.appendChild(b);
    });
  }
  box.hidden = false;
  box.scrollTop = 0;
  const t = box.querySelector('.today');
  if (t) t.scrollIntoView();
}

async function start() {
  try {
    const [r, d] = await Promise.all([fetch('../recipes.json', { cache: 'no-store' }),
                                      fetch('decks.json', { cache: 'no-store' })]);
    recipes = await r.json();
    decks = await d.json();
  } catch (e) {
    $('days').hidden = false;
    $('days').textContent = 'Couldn’t load the recipes. Check the Wi-Fi, then cast this page again.';
    return;
  }
  const want = params.get('deck');
  if (want) {
    for (const list of Object.values(recipes)) {
      const i = list.findIndex((r) => r.deck === want);
      if (i >= 0) return openDeck(list, i, 1);
    }
  }
  const list = recipes[today] || [];
  const s = saved();
  const resume = s && list.findIndex((r) => r.deck === s.deck);
  if (s && resume >= 0) openDeck(list, resume, s.slide);
  else if (list.length === 1) openDeck(list, 0, 1);
  else showDays(list.length ? '' : 'Nothing planned for today.');
}

// Taps: the right two-thirds of the slide moves on, the left third goes back. Swipes work too.
let x0 = null;
$('stage').addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
$('stage').addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  x0 = null;
  if (Math.abs(dx) > 60) { e.preventDefault(); step(dx < 0 ? 1 : -1); }
});
$('stage').addEventListener('click', (e) => { step(e.clientX < innerWidth / 3 ? -1 : 1); });
$('back').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('list').onclick = () => showDays('');
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Escape') showDays('');
});

// The radio: a few stations, played by this page so the slides and the sound share one cast
// (casting anything else to the Hub closes this page). A station starts only on a tap and plays
// on while the slides and days change, since none of that reloads the page. While the list of
// stations is open it sits on a layer over the whole page, so a tap off the list only closes it.
const radio = $('radio'), stream = $('stream'), picker = $('picker');
const stations = [...picker.querySelectorAll('[data-streams]')];
let radioState = 'off', station = null, radioTimer = 0;
const radioBusy = () => radioState === 'connecting' || radioState === 'on';
function showRadio(state) {
  const name = station && station.textContent;
  radioState = state;
  radio.dataset.state = state;
  radio.textContent = { off: '♪ Radio', connecting: '♪ Connecting…', on: '♪ ' + name,
                        unavailable: name + ' unavailable' }[state];
  for (const s of stations) s.classList.toggle('on', s === station && radioBusy());
  $('stop').hidden = !radioBusy();
}
function tune(s) {
  clearTimeout(radioTimer);
  station = s;
  showRadio('connecting');
  // The browser tries each <source> in turn until one plays.
  stream.replaceChildren(...s.dataset.streams.split(' ').map((src) =>
    Object.assign(document.createElement('source'), { src })));
  stream.load();   // it's live, so start from now rather than from anything buffered earlier
  stream.play().catch((err) => { if (err.name !== 'AbortError') radioFailed(); });
}
function stopRadio() {
  stream.pause();
  stream.currentTime = 0;
  // Take the sources out first: once it has played, Chrome ignores preload="none" and a bare
  // load() would fetch the stream all over again. With none left, it drops it and fetches nothing.
  stream.replaceChildren();
  stream.load();
  showRadio('off');
}
function radioFailed() {
  if (!radioBusy()) return;
  stopRadio();
  showRadio('unavailable');
  radioTimer = setTimeout(() => showRadio('off'), 4000);
}
function showPicker(open) {
  picker.hidden = !open;
  $('stations').style.left = radio.offsetLeft + 'px';   // just above the button
  showSteam();
}
radio.onclick = () => showPicker(picker.hidden);
picker.onclick = (e) => {
  const s = e.target.closest('button');
  showPicker(false);
  if (s && s.id === 'stop') stopRadio();
  else if (s && !(s === station && radioBusy())) tune(s);   // the station that's on stays on
};
document.addEventListener('keydown', (e) => {   // keys for the radio never reach the slides
  if (!picker.hidden) { e.stopPropagation(); if (e.key === 'Escape') showPicker(false); }
  else if (e.target === radio && e.key === ' ') e.stopPropagation();
});
stream.addEventListener('playing', () => { if (radioState === 'connecting') showRadio('on'); });
stream.addEventListener('pause', () => { if (radioBusy()) stopRadio(); });   // e.g. the stream ended
// A <source> that fails fires its own error and the browser moves on to the next one. An error
// on the last one means none of them played; one on the element means the stream broke off.
stream.addEventListener('error', (e) => {
  if (e.target === stream || e.target === stream.lastElementChild) radioFailed();
}, true);

// Motion. Each new slide is decoded first, then slides in from the side it comes from, over the
// last one, which stays on show beneath it (the ghost) until it's covered; a new dish or day just
// fades in. The latest change wins: one still loading is dropped, and one in flight jumps to its
// end. Title slides get steam. Only transform and opacity move, and nothing at all with reduced motion.
const frame = $('frame'), slide = $('slide'), ghost = $('ghost'), steam = $('steam');
const still = matchMedia('(prefers-reduced-motion: reduce)');
let seq = 0, fx = null, onTitle = false;
steam.remove();
new ResizeObserver(() => {   // the frame: the largest 16:9 box the stage holds (kept while the deck is hidden)
  const st = $('stage'), k = Math.min(st.clientWidth / 16, st.clientHeight / 9);
  if (!k) return;
  frame.style.width = 16 * k + 'px';
  frame.style.height = 9 * k + 'px';
}).observe($('stage'));
function show(url, dir, title) {   // dir: 1 forward, -1 back, 0 a new dish or day
  const n = ++seq, img = new Image();
  if (fx) fx.finish();
  if (!dir) {   // nothing of the last dish shows while this one loads
    slide.style.visibility = 'hidden';
    ghost.hidden = true;
    onTitle = false;
    showSteam();
  }
  img.src = url;
  img.decode().catch(() => {}).then(() => {
    if (n !== seq) return;
    const was = dir && !slide.style.visibility && !still.matches && slide.src;
    if (was) ghost.src = was;   // already loaded, so it shows at once
    ghost.hidden = !(was && ghost.complete);
    slide.src = url;
    slide.style.visibility = '';
    onTitle = title;
    showSteam();
    if (still.matches) return;
    const a = fx = slide.animate([{ opacity: 0, transform: 'translateX(' + 3.5 * dir + '%)' },
      { opacity: 1, transform: 'translateX(0)' }], { duration: 250, easing: 'ease-out' });
    a.onfinish = () => { if (fx === a) ghost.hidden = true; };
  });
}
function showSteam() {   // only while a title slide is on show; gone, not hidden, the rest of the time
  if (!onTitle || $('deck').hidden || !picker.hidden || still.matches) steam.remove();
  else if (!steam.isConnected) frame.append(steam);
}
still.onchange = showSteam;

// On a phone or tablet, keep the screen awake while a recipe is up.
async function stayAwake() {
  try { if ('wakeLock' in navigator && !document.hidden) await navigator.wakeLock.request('screen'); } catch (e) { }
}
document.addEventListener('visibilitychange', stayAwake);
addEventListener('click', stayAwake, { once: true });

// On the Nest Hub: a cast web page is closed after about ten minutes with nothing playing,
// and the Cast framework lays a media-controls layer over the page that swallows touches.
// So start a Cast receiver, play an invisible image every nine minutes, and remove that layer.
// Adapted from ha-catt-fix (MIT, Jarek Swierczynski), after Home Assistant's cast receiver.
function startCast() {
  const ctx = cast.framework.CastReceiverContext.getInstance();
  if (ctx.getDeviceCapabilities() === null) return;
  new MutationObserver(() => {
    const layer = document.querySelector('touch-controls');
    if (layer) layer.remove();
    for (const div of document.querySelectorAll('div')) {
      if (div.innerHTML.includes('--cast-controls')) div.remove();
    }
  }).observe(document.body, { childList: true, subtree: true });
  const player = document.createElement('cast-media-player');
  player.style.display = 'none';
  document.body.appendChild(player);
  const keepAlive = () => {
    const req = new cast.framework.messages.LoadRequestData();
    req.autoplay = true;
    req.media = new cast.framework.messages.MediaInformation();
    req.media.contentId = new URL('keepalive.png', location.href).href;
    req.media.contentType = 'image/png';
    req.media.streamType = cast.framework.messages.StreamType.NONE;
    req.media.metadata = new cast.framework.messages.GenericMediaMetadata();
    req.media.metadata.title = 'Kitchen recipes';
    req.requestId = 0;
    ctx.getPlayerManager().load(req);
    setTimeout(keepAlive, 9 * 60e3);
  };
  ctx.addEventListener(cast.framework.system.EventType.READY, keepAlive);
  const options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;
  options.statusText = 'Kitchen recipes';
  ctx.start(options);
}
if (/CrKey/.test(navigator.userAgent)) {
  const s = document.createElement('script');
  s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
  s.onload = () => { try { startCast(); } catch (e) { console.log('cast setup failed', e); } };
  document.head.appendChild(s);
}

start();
</script>
</body>
</html>
